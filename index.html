  function handlePlatformChange(radio) {
    const feeInput = document.getElementById('subscription_fee');
    const selectedPlatform = radio.value;
    
    if (selectedPlatform !== 'custom') {
      feeInput.value = platformPrices[selectedPlatform];
      feeInput.readOnly = true;
      feeInput.classList.add('bg-slate-100');
    } else {
      feeInput.value = '';
      feeInput.readOnly = false;
      feeInput.classList.remove('bg-slate-100');
      feeInput.focus();
    }
  }

  // 珥덇린 濡쒕뱶 ???뗭뾽

    document.getElementById('receipt_platform').innerText = platformText;

    document.getElementById('receipt_members').innerText = members + '紐?;
    document.getElementById('receipt_per_person').innerText = perPerson.toLocaleString() + '??;
    document.getElementById('receipt_bank').innerText = bankText;
    document.getElementById('receipt_barcode').innerText = barcodeId;

    // ?덉궗 ?뺣낫 ?띿뒪???쒓린
    const roundingInfoText = roundUnit > 1 ? `(${roundUnit}???⑥쐞 ?댄븯 ?덉궗 ?곸슜)` : '(?먮떒??誘몃쭔 ?덉궗 ?곸슜)';
    document.getElementById('receipt_rounding_info').innerText = roundingInfoText;

    // ?꾩뿭 ?곹깭 ?낅뜲?댄듃
    lastCalculation = {
      platformName: platformText,

      members: members,
      perPerson: perPerson,
      bankInfo: bankText

    const receiptSection = document.getElementById('receipt_section');
    receiptSection.classList.remove('hidden');
    receiptSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
